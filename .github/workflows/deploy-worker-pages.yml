name: Deploy Worker and Pages

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker-pages.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Wrangler environment to deploy
        required: true
        default: production
        type: choice
        options: [production, preview]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Repository secrets required:
  #   CLOUDFLARE_API_TOKEN   - token with Workers, D1, KV, R2 and Pages edit rights
  #   CLOUDFLARE_ACCOUNT_ID  - account id
  # Repository variables required:
  #   API_BASE_URL           - public URL of the deployed Worker
  #   PAGES_PROJECT          - Cloudflare Pages project name
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preflight:
    name: Check deployment credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # A fork, or a clone of this repository, has no Cloudflare credentials and
      # no Cloudflare account to deploy into. Without this gate every push to
      # main would leave a red X on a repository whose code is fine, which is
      # worse than no signal at all. Missing credentials mean "not my
      # deployment", so the deploy jobs are skipped, not failed.
      - name: Check
        id: check
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          [ -n "$API_BASE_URL" ]          || missing+=("variable API_BASE_URL")
          [ -n "$PAGES_PROJECT" ]         || missing+=("variable PAGES_PROJECT")

          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All four values are set; deploying." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment skipped"
            echo
            echo "This repository is not configured to deploy to Cloudflare. Missing:"
            echo
            for item in "${missing[@]}"; do echo "- \`$item\`"; done
            echo
            echo "Set them under **Settings → Secrets and variables → Actions**."
            echo "See [\`docs/deployment.md\`](../blob/main/docs/deployment.md)."
            echo
            echo "The code itself is tested by the CI workflow, which runs regardless."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}

  worker:
    name: Worker
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the Worker test harness backs D1 with a real in-memory
          # SQLite database via `node:sqlite`, which landed in Node 22.5.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test before deploying
        run: npm test --workspace @wf/worker

      - name: Apply D1 migrations
        working-directory: worker
        run: |
          npx wrangler d1 migrations apply watermark-finder --remote \
            ${{ inputs.environment == 'preview' && '--env preview' || '' }}

      - name: Deploy
        working-directory: worker
        run: |
          npx wrangler deploy \
            ${{ inputs.environment == 'preview' && '--env preview' || '' }}

      - name: Smoke test the deployment
        run: |
          for _ in $(seq 1 10); do
            status=$(curl -s -o /tmp/health.json -w '%{http_code}' "${{ vars.API_BASE_URL }}/api/health" || true)
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              cat /tmp/health.json
              # 503 means a dependency is asleep, which is normal for a free
              # Space; the Worker itself answered, so the deploy is good.
              exit 0
            fi
            sleep 5
          done
          echo "Worker did not respond after deployment"
          exit 1

  pages:
    name: Pages
    runs-on: ubuntu-latest
    needs: [preflight, worker]
    if: needs.preflight.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the Worker test harness backs D1 with a real in-memory
          # SQLite database via `node:sqlite`, which landed in Node 22.5.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the static site
        run: npm run build --workspace @wf/web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy web/out \
            --project-name "${{ vars.PAGES_PROJECT }}" \
            --branch "${{ github.ref_name }}" \
            --commit-dirty=true
