name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Analysis engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis-space
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analysis-space/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check tpl app.py train.py tests

      - name: Test
        run: pytest --cov=tpl --cov-report=term-missing

      - name: Verify the documented example results
        run: python ../examples/generate.py --verify

      - name: Verify the app imports and serves
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from tpl.api import create_app
          client = TestClient(create_app())
          assert client.get('/health').status_code == 200
          assert client.get('/version').status_code == 200
          print('service boots')
          "

  browser:
    name: Browser bundle (Pyodide surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No `pip install` on purpose. The page loads Pyodide's standard library
      # and nothing else, so this job runs the bundle against an interpreter
      # with nothing installed - the same floor the browser has.
      - name: Copy the engine into the browser bundle
        run: python space-static/build.py

      - name: Verify the copy matches the engine
        run: python space-static/build.py --check

      - name: Run the bundle the way the page does
        run: python space-static/build.py --verify

  node:
    name: Worker and web (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the Worker test harness backs D1 with a real in-memory
          # SQLite database via `node:sqlite`, which landed in Node 22.5.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the frontend
        run: npm run build --workspace @wf/web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://watermark-finder-api.workers.dev

      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
        working-directory: worker

  integration:
    name: Worker <-> engine integration
    runs-on: ubuntu-latest
    needs: [engine, node]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analysis-space/requirements.txt

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the Worker test harness backs D1 with a real in-memory
          # SQLite database via `node:sqlite`, which landed in Node 22.5.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r analysis-space/requirements.txt
          npm ci

      - name: Start the analysis engine
        working-directory: analysis-space
        env:
          TPL_API_TOKEN: ci-secret
        run: |
          uvicorn app:app --host 127.0.0.1 --port 7860 --log-level warning &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:7860/health && break
            sleep 1
          done

      - name: Drive the real Worker against the real engine
        working-directory: worker
        env:
          ENGINE_URL: http://127.0.0.1:7860
          ENGINE_TOKEN: ci-secret
        run: npx tsx test/e2e.manual.ts
